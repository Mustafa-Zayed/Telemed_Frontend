<div class="container">
  <div class="form-container">
    <h2 class="form-title">Login to Telemed</h2>

    @if (error()) {
      <div class="alert alert-error">
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="handleSubmit($event)">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input
          type="email"
          name="email"
          class="form-input"
          [(ngModel)]="formData().email"
          (ngModelChange)="formData.set({ ...formData(), email: $event })"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          name="password"
          class="form-input"
          [(ngModel)]="formData().password"
          (ngModelChange)="formData.set({ ...formData(), password: $event })"
          required
        />
      </div>

      <button type="submit" class="form-btn">Login</button>
    </form>

    <div class="social-login">
      <button class="google-button" (click)="onGoogleLogin()">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          height="1em"
          viewBox="0 0 488 512"
          fill="currentColor"
        >
          <path
            d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 54.4 139.6 138.8 139.6 84.8 0 148.9-63.6 148.9-138.6 0-19.3-1.4-32.6-3.8-46.1H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 47.9z"
          />
        </svg>
        Login with Google
      </button>
    </div>

    <div class="form-link">
      <p>
        Don't have an account?
        <a routerLink="/register">Register as Patient</a> or
        <a routerLink="/register-doctor">Register as Doctor</a>
      </p>
      <p>
        Forgot Password?
        <a routerLink="/forgot-password">Reset Password here</a>
      </p>
    </div>
  </div>
</div>
