<div class="container">
  <div class="form-container">
    <h2 class="form-title">Update Doctor Profile</h2>

    @if (error()) {
      <div class="form-container">
        <div class="alert alert-error">{{ error() }}</div>
      </div>
    }

    @if (success()) {
      <div class="form-container">
        <div class="alert alert-success">{{ success() }}</div>
      </div>
    }

    <form (ngSubmit)="handleSubmit($event)">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input
            type="text"
            name="firstName"
            class="form-input"
            [(ngModel)]="formData().firstName"
            (ngModelChange)="formData.set({ ...formData(), firstName: $event })"
            placeholder="Enter your first name"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input
            type="text"
            name="lastName"
            class="form-input"
            [(ngModel)]="formData().lastName"
            (ngModelChange)="formData.set({ ...formData(), lastName: $event })"
            placeholder="Enter your last name"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Specialization</label>
        <select
          name="specialization"
          class="form-select"
          [(ngModel)]="formData().specialization"
          (ngModelChange)="formData.set({ ...formData(), specialization: $event })"
          required
        >
          <option value="">Select your specialization</option>
          @for (spec of specializations(); track $index) {
            <option [value]="spec">
              {{ formatSpecialization(spec) }}
            </option>
          }
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="handleCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary">Update Profile</button>
      </div>
    </form>
  </div>
</div>
