<div class="container">
  <div class="form-container">
    <h2 class="form-title">Register as Patient</h2>

    @if (error()) {
      <div class="alert alert-error">
        {{ error() }}
      </div>
    }

    @if (success()) {
      <div class="alert alert-success">
        {{ success() }}
      </div>
    }

    <form (ngSubmit)="handleSubmit($event)">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input
          type="text"
          name="name"
          class="form-input"
          [(ngModel)]="formData().name"
          (ngModelChange)="formData.set({ ...formData(), name: $event })"
          required
        />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input
          type="email"
          name="email"
          class="form-input"
          [(ngModel)]="formData().email"
          (ngModelChange)="formData.set({ ...formData(), email: $event })"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input
          type="password"
          name="password"
          class="form-input"
          [(ngModel)]="formData().password"
          (ngModelChange)="formData.set({ ...formData(), password: $event })"
          required
        />
      </div>

      <button type="submit" class="form-btn">Register as Patient</button>
    </form>

    <div class="form-link">
      <p>Already have an account? <a routerLink="/login">Login here</a></p>
      <p class="mt-1">
        Want to register as a doctor? <a routerLink="/register-doctor">Click here</a>
      </p>
    </div>
  </div>
</div>
