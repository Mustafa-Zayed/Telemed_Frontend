<div class="container">
  <div class="form-container">
    <h2 class="form-title">Update Password</h2>

    @if (error()) {
      <div class="alert alert-error">
        {{ error() }}
      </div>
    }

    @if (success()) {
      <div class="alert alert-success">
        {{ success() }}
      </div>
    }

    <form (ngSubmit)="handleSubmit($event)">
      <div class="form-group">
        <label class="form-label">Current Password</label>
        <input
          type="password"
          name="oldPassword"
          class="form-input"
          [(ngModel)]="formData().oldPassword"
          (ngModelChange)="formData.set({ ...formData(), oldPassword: $event })"
          placeholder="Enter your current password"
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label">New Password</label>
        <input
          type="password"
          name="newPassword"
          class="form-input"
          [(ngModel)]="formData().newPassword"
          (ngModelChange)="formData.set({ ...formData(), newPassword: $event })"
          placeholder="Enter new password"
          required
          minlength="6"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Confirm New Password</label>
        <input
          type="password"
          name="confirmPassword"
          class="form-input"
          [(ngModel)]="formData().confirmPassword"
          (ngModelChange)="formData.set({ ...formData(), confirmPassword: $event })"
          placeholder="Confirm your new password"
          required
          minlength="6"
        />
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="handleCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary">Update Password</button>
      </div>
    </form>
  </div>
</div>
